name: Update README

on:
  schedule:
    - cron: '17 5 * * *' # Daily at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README
        shell: pwsh
        run: ./.github/workflows/Update-Readme.ps1

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with latest downloads and posts"
          git push
